# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: cow-programmatic-orders
disable_default_cross_chain: true # recommended; default in HyperIndex v4
description: CoW Protocol Programmatic Orders Indexer — Composable CoW generators, discrete-order lifecycle, COWShed ownership, and Aave flash-loan orders
# Addresses and start blocks mirror src/chains/*.ts (which mirror the upstream
# ponder indexer's chain registry). Active chains: mainnet + gnosis.

contracts:
  - name: ComposableCoW
    abi_file_path: abis/ComposableCoW.json
    handler: src/handlers/ComposableCoW.ts
    events:
      - event: ConditionalOrderCreated

  - name: COWShedFactory
    abi_file_path: abis/COWShedFactory.json
    handler: src/handlers/COWShedFactory.ts
    events:
      - event: COWShedBuilt

  - name: GPv2Settlement
    abi_file_path: abis/GPv2Settlement.json
    handler: src/handlers/GPv2Settlement.ts
    events:
      - event: Settlement

chains:
  - id: 1 # Ethereum Mainnet
    start_block: 17883049
    contracts:
      - name: ComposableCoW
        address: "0xfdaFc9d1902f4e0b84f65F49f244b32b31013b74"
        start_block: 17883049
      - name: COWShedFactory
        # Official deployments: https://github.com/cowdao-grants/cow-shed/blob/main/networks.json
        address:
          - "0x5e284e80f3bd6a7d80a8500d9c49878028110848" # v2.1.0 factory for COWShedForComposableCoW
          - "0xc94f7d71d022e773b0b516841ff867c06f39726b" # v2.1.0 factory for COWShed
          - "0x312f92fe5f1710408b20d52a374fa29e099cfa86" # legacy (COWShed)
        start_block: 22939254 # earliest COWShedBuilt from any configured factory
      - name: GPv2Settlement
        address: "0x9008D19f58AAbD9eD0D60971565AA8510560ab41"
        start_block: 23812751 # AaveV3AdapterFactory deployment block

  - id: 100 # Gnosis Chain
    start_block: 29389123
    contracts:
      - name: ComposableCoW
        address: "0xfdaFc9d1902f4e0b84f65F49f244b32b31013b74"
        start_block: 29389123
      - name: COWShedFactory
        # Official deployments: https://github.com/cowdao-grants/cow-shed/blob/main/networks.json
        address:
          - "0x5e284e80f3bd6a7d80a8500d9c49878028110848" # v2.1.0 factory for COWShedForComposableCoW
          - "0xc94f7d71d022e773b0b516841ff867c06f39726b" # v2.1.0 factory for COWShed
          - "0x4f4350bf2c74aacd508d598a1ba94ef84378793d" # v2.0.0 (CoWShedForComposableCoW)
          - "0x312f92fe5f1710408b20d52a374fa29e099cfa86" # legacy (COWShed); 2 historical events
        start_block: 41469991 # earliest COWShedBuilt from any configured factory on Gnosis
      - name: GPv2Settlement
        address: "0x9008D19f58AAbD9eD0D60971565AA8510560ab41"
        start_block: 43177077 # AaveV3AdapterFactory deployment block on Gnosis

# number/timestamp/hash block fields are always selected by default.
field_selection:
  transaction_fields:
    - hash
